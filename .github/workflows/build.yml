name: Build APKs
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      # کلید امضای ثابت (از Secrets). بدون آن APK با کلید موقت امضا می‌شود و نسخهٔ جدید روی قبلی نصب نمی‌شود.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/classify.keystore"
            echo "CLASSIFY_KEYSTORE_FILE=$RUNNER_TEMP/classify.keystore" >> "$GITHUB_ENV"
            echo "Using the fixed signing key."
          else
            echo "::warning::KEYSTORE_BASE64 is not set. APKs are signed with a temporary key, so updates cannot be installed over older builds."
          fi

      - name: Build student and manager APKs
        env:
          CLASSIFY_SERVER_URL: ${{ vars.CLASSIFY_SERVER_URL }}
          CLASSIFY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLASSIFY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLASSIFY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleStudentDebug assembleManagerDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Classify-student
          path: app/build/outputs/apk/student/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Classify-manager
          path: app/build/outputs/apk/manager/debug/*.apk
